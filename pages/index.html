<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/styles/main.css">
    <title>Shopping Tracker</title>
</head>
<body>

    <div class="header">
        <h1>🛒 Shopping Tracker</h1>
        <p>Harcamalarını takip et ve kontrol altında tut</p>
    </div>

    
    <input type="text" id="nameInput" placeholder="Ürün Adı ...">
    <input type="text" id="priceInput" placeholder="Ürün Fiyatı ...">

    <select id="category">
        <option value="Market">Market</option>
        <option value="Teknoloji">Teknoloji</option>
        <option value="Diğer">Diğer</option>
    </select>


    <button onclick="addProduct()">EKLE</button>

    <ul id="productList"></ul>

    <p id="balance"></p>

    <script src="/js/main4.js"></script>
</body>
</html>
